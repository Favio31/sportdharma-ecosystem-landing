<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Colores - SportDharma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      text-align: center;
      color: #60A5FA;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 15px 20px;
      font-size: 1.2rem;
      border: 2px solid #334155;
      border-radius: 8px;
      background: #1E293B;
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      outline: none;
    }
    input:focus {
      border-color: #3B82F6;
    }
    button {
      padding: 15px 25px;
      font-size: 1rem;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #3B82F6;
    }
    .preview {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
      border: 3px solid #334155;
      transition: all 0.3s ease;
    }
    .info {
      background: #1E293B;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .info p {
      margin: 8px 0;
      font-size: 1.1rem;
    }
    .info span {
      color: #60A5FA;
      font-weight: bold;
    }
    .paleta {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    .color-chip {
      padding: 15px 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .color-chip:hover {
      transform: scale(1.05);
      border-color: white;
    }
    .color-chip small {
      display: block;
      margin-top: 5px;
      font-size: 0.7rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>🎨 Visor de Colores - SportDharma</h1>
  
  <div class="container">
    <div class="input-group">
      <input type="text" id="colorInput" placeholder="#0F172A" maxlength="7" value="#0F172A">
      <button onclick="aplicarColor()">Ver</button>
    </div>

    <div class="preview" id="preview">
      <span id="previewText">#0F172A</span>
    </div>

    <div class="info">
      <p>HEX: <span id="hexVal">#0F172A</span></p>
      <p>RGB: <span id="rgbVal">15, 23, 42</span></p>
      <p>Contraste con blanco: <span id="contrastVal">17.4:1 ✅</span></p>
    </div>

    <div class="paleta">
      <div class="color-chip" style="background:#0F172A;color:white" onclick="cargarColor('#0F172A')">
        #0F172A<small>Azul Noche</small>
      </div>
      <div class="color-chip" style="background:#1E293B;color:white" onclick="cargarColor('#1E293B')">
        #1E293B<small>Azul Marino</small>
      </div>
      <div class="color-chip" style="background:#334155;color:white" onclick="cargarColor('#334155')">
        #334155<small>Gris Pizarra</small>
      </div>
      <div class="color-chip" style="background:#EFF6FF;color:#1E293B" onclick="cargarColor('#EFF6FF')">
        #EFF6FF<small>Azul Cielo</small>
      </div>
      <div class="color-chip" style="background:#F1F5F9;color:#1E293B" onclick="cargarColor('#F1F5F9')">
        #F1F5F9<small>Gris Humo</small>
      </div>
      <div class="color-chip" style="background:#2563EB;color:white" onclick="cargarColor('#2563EB')">
        #2563EB<small>Azul Eléctrico</small>
      </div>
      <div class="color-chip" style="background:#3B82F6;color:white" onclick="cargarColor('#3B82F6')">
        #3B82F6<small>Azul Brillante</small>
      </div>
      <div class="color-chip" style="background:#60A5FA;color:#0F172A" onclick="cargarColor('#60A5FA')">
        #60A5FA<small>Azul Cielo</small>
      </div>
      <div class="color-chip" style="background:#FFFFFF;color:#0F172A" onclick="cargarColor('#FFFFFF')">
        #FFFFFF<small>Blanco Puro</small>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('colorInput');
    const preview = document.getElementById('preview');
    const previewText = document.getElementById('previewText');
    const hexVal = document.getElementById('hexVal');
    const rgbVal = document.getElementById('rgbVal');
    const contrastVal = document.getElementById('contrastVal');

    input.addEventListener('input', aplicarColor);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') aplicarColor();
    });

    function cargarColor(color) {
      input.value = color.toUpperCase();
      aplicarColor();
    }

    function aplicarColor() {
      let color = input.value.trim();
      if (!color.startsWith('#')) color = '#' + color;
      
      if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
        preview.style.backgroundColor = color;
        previewText.textContent = color.toUpperCase();
        hexVal.textContent = color.toUpperCase();
        
        const rgb = hexToRgb(color);
        rgbVal.textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
        
        const contraste = calcularContraste(rgb);
        contrastVal.textContent = `${contraste}:1 ${contraste >= 7 ? '✅ AAA' : contraste >= 4.5 ? '⚠️ AA' : '❌ Bajo'}`;
        
        previewText.style.color = contraste >= 4.5 ? 'white' : 'black';
      }
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    function luminancia(r, g, b) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c = c / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function calcularContraste(rgb) {
      const lum1 = luminancia(rgb.r, rgb.g, rgb.b);
      const lum2 = luminancia(255, 255, 255);
      const lighter = Math.max(lum1, lum2);
      const darker = Math.min(lum1, lum2);
      return ((lighter + 0.05) / (darker + 0.05)).toFixed(1);
    }

    aplicarColor();
  </script>
</body>
</html>
