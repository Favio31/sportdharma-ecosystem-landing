name: Send Automated Push Notification

on:
  push:
    branches:
      - main
    paths:
      - 'src/pages/**'
      - 'src/content/**'
  workflow_dispatch:
    inputs:
      custom_title:
        description: 'Título personalizado (opcional)'
        required: false
        default: '🚴♂️ ¡Nuevo Contenido en SportDharma!'
      custom_body:
        description: 'Cuerpo del mensaje (opcional)'
        required: false
        default: 'Se ha publicado nuevo contenido soberano y offline-first.'

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install web-push
        run: npm install web-push

      - name: Send Push Notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CUSTOM_TITLE: ${{ github.event.inputs.custom_title }}
          CUSTOM_BODY: ${{ github.event.inputs.custom_body }}
        run: |
          node -e "
          const webpush = require('web-push');

          webpush.setVapidDetails(
            'mailto:contact@sportdharmaecosystem.com',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          async function sendNotifications() {
            try {
              // Obtener lista de keys del KV
              const kvListUrl = \`https://api.cloudflare.com/client/v4/accounts/\${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/\${process.env.KV_NAMESPACE_ID}/keys\`;
              
              const listResponse = await fetch(kvListUrl, {
                method: 'GET',
                headers: {
                  'Authorization': \`Bearer \${process.env.CF_API_TOKEN}\`,
                  'Content-Type': 'application/json'
                }
              });
              
              if (!listResponse.ok) {
                const errorText = await listResponse.text();
                console.error('❌ Error al obtener keys del KV:', listResponse.status, errorText);
                console.error('🔍 Verificá que:');
                console.error('   1. El API Token tenga permisos de lectura en KV');
                console.error('   2. El KV_NAMESPACE_ID sea correcto');
                console.error('   3. El CF_ACCOUNT_ID sea correcto');
                process.exit(0); // Salir con éxito para no fallar el workflow
              }
              
              const listData = await listResponse.json();
              const keys = listData.result || [];
              
              console.log('📋 Suscriptores encontrados: ' + keys.length);
              
              if (keys.length === 0) {
                console.log('️ No hay suscriptores aún. El sistema está listo y funcionando.');
                process.exit(0);
              }

              const title = process.env.CUSTOM_TITLE || '🚴♂️ ¡Nuevo Contenido en SportDharma!';
              const body = process.env.CUSTOM_BODY || 'Se ha publicado nuevo contenido soberano y offline-first.';
              
              const payload = JSON.stringify({
                title: title,
                body: body,
                icon: '/icon-192.png',
                badge: '/badge-72.png',
                url: 'https://www.sportdharmaecosystem.com/es/noticias/',
                tag: 'sportdharma-update',
                requireInteraction: false
              });

              let successCount = 0;
              let failCount = 0;
              
              for (const key of keys) {
                try {
                  // Obtener el objeto de suscripción completo
                  const getValueUrl = \`https://api.cloudflare.com/client/v4/accounts/\${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/\${process.env.KV_NAMESPACE_ID}/values/\${key.name}\`;
                  
                  const valueResponse = await fetch(getValueUrl, {
                    method: 'GET',
                    headers: {
                      'Authorization': \`Bearer \${process.env.CF_API_TOKEN}\`,
                      'Content-Type': 'application/json'
                    }
                  });
                  
                  if (!valueResponse.ok) {
                    console.error('️ No se pudo obtener ' + key.name + ': ' + valueResponse.status);
                    failCount++;
                    continue;
                  }
                  
                  const subscription = await valueResponse.json();
                  await webpush.sendNotification(subscription, payload);
                  successCount++;
                  console.log('✅ Enviado a: ' + key.name);
                } catch (err) {
                  failCount++;
                  console.error('❌ Error con ' + key.name + ':', err.message);
                }
              }
              
              console.log('');
              console.log('📊 RESUMEN FINAL:');
              console.log('   Total suscriptores: ' + keys.length);
              console.log('   Enviados exitosamente: ' + successCount);
              console.log('   Fallidos: ' + failCount);
              
            } catch (err) {
              console.error('❌ Error general en el proceso:', err.message);
              process.exit(0); // No fallar el workflow por errores de notificación
            }
          }
          
          sendNotifications();
          "