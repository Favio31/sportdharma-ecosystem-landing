name: Send Automated Push Notification

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/**'

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push

      - name: Send Push Notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          node -e "
          const webpush = require('web-push');
          const https = require('https');

          webpush.setVapidDetails(
            'mailto:contact@sportdharmaecosystem.com',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          const kvUrl = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT_ID + '/storage/kv/namespaces/' + process.env.KV_NAMESPACE_ID + '/keys';
          
          const req = https.get(kvUrl + '?token=' + process.env.CF_API_TOKEN, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', async () => {
              try {
                const keys = JSON.parse(data).result;
                console.log('Encontrados ' + keys.length + ' suscriptores.');
                
                const payload = JSON.stringify({
                  title: '🚴‍♂️ ¡Nuevo Contenido en SportDharma!',
                  body: 'Se ha publicado nuevo contenido soberano y offline-first.',
                  icon: '/icon-192.png',
                  url: 'https://www.sportdharmaecosystem.com/es/noticias/'
                });

                let successCount = 0;
                for (const key of keys) {
                  try {
                    const subRes = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT_ID + '/storage/kv/namespaces/' + process.env.KV_NAMESPACE_ID + '/values/' + key.name + '?token=' + process.env.CF_API_TOKEN);
                    const subData = await subRes.json();
                    
                    if (subData.success && subData.result) {
                      const subscription = JSON.parse(subData.result);
                      await webpush.sendNotification(subscription, payload);
                      successCount++;
                    }
                  } catch (err) {
                    console.error('Error enviando a ' + key.name + ':', err.message);
                  }
                }
                console.log('✅ Notificaciones enviadas a ' + successCount + ' suscriptores.');
              } catch (err) {
                console.error('❌ Error en el proceso:', err);
              }
            });
          });
          "