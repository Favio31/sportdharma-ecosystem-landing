name: Send Web Push Notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Título de la notificación'
        required: true
        default: '‍♂️ ¡Nueva Actualización!'
      body:
        description: 'Cuerpo del mensaje'
        required: true
        default: 'Hay nuevo contenido en SportDharma Ecosystem.'

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install web-push

      - name: Send Push Notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          PUSH_TITLE: ${{ github.event.inputs.title }}
          PUSH_BODY: ${{ github.event.inputs.body }}
        run: |
          node << 'EOF'
          const webpush = require('web-push');

          // Configurar VAPID
          webpush.setVapidDetails(
            'mailto:contact@sportdharmaecosystem.com',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          async function getSubscribers() {
            const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.KV_NAMESPACE_ID}/keys`;
            
            console.log('🔍 Consultando KV...');
            console.log('URL:', url);
            
            const response = await fetch(url, {
              headers: { 
                'Authorization': `Bearer ${process.env.CF_API_TOKEN}`,
                'Content-Type': 'application/json'
              }
            });
            
            console.log('Status:', response.status);
            
            if (!response.ok) {
              throw new Error(`Error al obtener keys del KV: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('Respuesta completa:', JSON.stringify(data, null, 2));
            
            if (!data.success) {
              throw new Error('La API de Cloudflare respondió con success: false');
            }
            
            if (!data.result || !Array.isArray(data.result)) {
              console.log('️ No hay suscriptores en el KV');
              return [];
            }
            
            console.log(`📋 Suscriptores encontrados: ${data.result.length}`);
            return data.result;
          }

          async function sendNotifications() {
            const keys = await getSubscribers();
            
            if (keys.length === 0) {
              console.log('⚠️ No hay suscriptores. El sistema está listo, pero nadie se ha suscrito aún.');
              return;
            }

            const payload = JSON.stringify({
              title: process.env.PUSH_TITLE,
              body: process.env.PUSH_BODY,
              icon: '/logo-social2.jpg',
              badge: '/logo-social2.jpg',
              url: 'https://www.sportdharmaecosystem.com/es/'
            });

            let successCount = 0;
            let failCount = 0;

            for (const key of keys) {
              try {
                console.log(`\n Procesando: ${key.name}`);
                
                // Obtener el valor completo de la suscripción
                const valUrl = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.KV_NAMESPACE_ID}/values/${encodeURIComponent(key.name)}`;
                
                const valResponse = await fetch(valUrl, {
                  headers: { 
                    'Authorization': `Bearer ${process.env.CF_API_TOKEN}`,
                    'Content-Type': 'application/json'
                  }
                });
                
                if (!valResponse.ok) {
                  console.log(`⚠️ No se pudo obtener el valor: ${valResponse.status}`);
                  failCount++;
                  continue;
                }
                
                // Cloudflare KV devuelve el texto crudo
                const subscriptionText = await valResponse.text();
                
                try {
                  const subscription = JSON.parse(subscriptionText);

                  // Verificar que tenga las claves necesarias
                  if (!subscription.endpoint || !subscription.keys?.p256dh || !subscription.keys?.auth) {
                    console.log(`⚠️ Saltando suscripción inválida (sin claves): ${key.name.substring(0, 30)}...`);
                    failCount++;
                    continue;
                  }

                  await webpush.sendNotification(subscription, payload);
                  console.log(`✅ Enviado a: ${key.name.substring(0, 50)}...`);
                  successCount++;
                } catch (parseError) {
                  console.log(`⚠️ Error al parsear JSON: ${parseError.message}`);
                  failCount++;
                }
              } catch (error) {
                console.error(`❌ Falló para ${key.name}: ${error.message}`);
                failCount++;
              }
            }

            console.log('\n📊 RESUMEN FINAL:');
            console.log(`   Total suscriptores: ${keys.length}`);
            console.log(`   Enviados exitosamente: ${successCount}`);
            console.log(`   Fallidos: ${failCount}`);
            
            if (failCount > 0 && successCount === 0) {
              process.exit(1);
            }
          }

          sendNotifications().catch(err => {
            console.error('❌ Error fatal:', err);
            process.exit(1);
          });
          EOF
