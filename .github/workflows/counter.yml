name: Increment Counter
on:
  repository_dispatch:
    types: [increment_push_counter]
jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increment
        run: node -e "const d=require('./public/stats.json'); d.push_subscribers++; require('fs').writeFileSync('./public/stats.json', JSON.stringify(d, null, 2));"
      - name: Commit
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add public/stats.json
          git commit -m "chore: bump counter" || echo "No changes"
          git push
