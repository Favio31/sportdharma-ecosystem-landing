name: Increment Counter
on:
  repository_dispatch:
    types: [increment_push_counter]
permissions:
  contents: write
jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increment Counter
        run: |
          FILE="public/stats.json"
          if [ -f "" ]; then
            CURRENT=
          else
            CURRENT=0
          fi
          NEW=
          echo "{\"push_subscribers\": $NEW}" > ""
          echo "NEW_COUNT=" >> $GITHUB_ENV
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump counter to ${{ env.NEW_COUNT }}"
          file_pattern: public/stats.json
